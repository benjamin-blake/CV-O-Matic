name: Sync postings to Google Drive

# Optional: mirrors posting artefacts to Google Drive. If the GDRIVE_TOKEN_JSON
# secret is not set, every step after the token check is skipped and the job
# succeeds, so a fresh template user who skips Drive setup sees no failures.
# Triggered when the /scan-indeed or /scan-companies routines push new posting artefacts to main.
# Path filter prevents firing on commits that only touch config/, CLAUDE.md, etc.
on:
  push:
    branches: [main]
    paths:
      - 'postings/**'
      - 'applications.yaml'
  workflow_dispatch:  # allow manual fire from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Only install what integrations/google_drive.py + main.py actually import.
      # Skipping Playwright/Jinja keeps the run under 30s.
      - name: Install Drive sync dependencies
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth-httplib2 \
            google-auth-oauthlib \
            python-dotenv

      - name: Write Google Drive OAuth token
        id: token
        env:
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
        run: |
          if [ -z "$GDRIVE_TOKEN_JSON" ]; then
            echo "::notice::GDRIVE_TOKEN_JSON secret is not set; skipping Drive sync (optional feature)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GDRIVE_TOKEN_JSON" > token.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Sync postings to Drive
        if: steps.token.outputs.enabled == 'true'
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
        run: python main.py sync

      # The refresh in google_drive.py rewrites token.json if the access token expired.
      # The refresh token itself rarely rotates, but if it does we lose it at job end - 
      # surface a warning so a stale token doesn't silently break future runs.
      - name: Check token freshness
        if: always() && steps.token.outputs.enabled == 'true'
        run: |
          if [ -f token.json ]; then
            python -c "import json,sys; t=json.load(open('token.json')); sys.exit(0 if t.get('refresh_token') else 1)" || \
              echo "::warning::token.json no longer contains a refresh_token - re-run OAuth locally and update the GDRIVE_TOKEN_JSON secret."
          fi
