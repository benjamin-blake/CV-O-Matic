name: Fetch ATS cache

# Runs daily on a GitHub runner (open egress) to fetch ATS list endpoints and
# filtered body bundles for every company in config/company_watchlist.yaml.
# Writes data/ats-cache/manifest.json plus per-candidate body markdowns to
# data/ats-cache/bodies/{YYYY-MM-DD}/.
#
# The Anthropic scheduled-agent container can't reach ATS hosts (egress
# allowlist blocks all five providers, probed 2026-05-15). This workflow is
# the producer side of the hybrid: it commits the manifest + bodies to main
# so /scan-companies in the container reads them from disk in its Tier 1
# step instead of hitting the network.
#
# Scheduled 2 hours before the daily /scan-companies routine (07:00 UTC), so
# the manifest is fresh when the skill loads it.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ats-cache
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --quiet requests pyyaml

      - name: Fetch ATS list endpoints and bodies
        run: python scripts/fetch_ats_cache.py

      # Direct push from github-actions[bot] - does NOT go through a PR, so
      # auto-merge-routine.yml's scope check doesn't apply. `[skip ci]` is
      # defensive: no current push listener watches data/ats-cache/**, but
      # future workflows might.
      - name: Commit manifest and bodies if changed
        run: |
          if [ -n "$(git status --porcelain data/ats-cache/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/ats-cache/
            git commit -m "chore(ats-cache): refresh $(date -u +%Y-%m-%d) [skip ci]"
            # Retry push with rebase to handle race with concurrent main pushes.
            # If the rebase itself fails (conflict on data/ats-cache/), abort
            # cleanly and surface the failure rather than wedging the workflow.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if ! git pull --rebase; then
                git rebase --abort || true
                echo "::error::rebase failed on attempt $attempt - likely conflict on data/ats-cache/. Manual intervention required."
                exit 1
              fi
            done
            exit 1
          fi

      # No --label: those labels do not exist in a fresh repo and `gh issue
      # create --label foo` returns 422, which `|| true` would silently swallow
      # and you'd lose the alert. Title-prefix-based filtering is enough.
      - name: Alert on broken fetch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "ATS cache fetch failed ($(date -u +%Y-%m-%d))" \
            --body "fetch-ats-cache.yml failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
