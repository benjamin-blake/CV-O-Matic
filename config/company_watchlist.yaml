# EXAMPLE watchlist, tuned for UK data / analytics roles (analyst, analytics engineer,
# data engineer, data science and AI/ML adjacent). Keep what suits you and edit freely:
# /discover-companies proposes new ATS-verified additions and /prune-watchlist removes
# stale slugs, so the list maintains itself once those are scheduled.
#
# Companies to monitor for off-board postings - roles that often never reach Indeed.
# Crawled by /scan-companies (omnibus) or /scan-companies --only <name> (single).
# See CLAUDE.md and .claude/commands/scan-companies.md.
#
# Filter semantics:
#   Title and location filtering use config/job_seeker.yaml :: target_roles and :: location.
#   No per-company keyword overrides - single source of truth keeps things consistent.
#   If you want a company-specific role title included (e.g. "Research Engineer" only at
#   AI labs), add it to job_seeker.yaml :: target_roles globally and rely on job-matcher
#   to reject it at non-relevant companies.
#
# Each company has an `ats` field telling /scan-companies which public job board API to
# hit (Tier 1 fetch). Slug values verified by probe on 2026-05-15.
# This file is intentionally ATS-only - companies without Greenhouse/Lever/Ashby/
# SmartRecruiters/Workable were dropped after the 2026-05-15 pivot, since Tier 2/3
# fallbacks (WebSearch, WebFetch) proved unreliable against modern bot blocking. Civil
# service and other no-ATS sources are picked up via /scan-indeed.
#
# ATS endpoint reference:
#   greenhouse:      https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
#   lever:           https://api.lever.co/v0/postings/{slug}?mode=json
#   ashby:           https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
#   smartrecruiters: https://api.smartrecruiters.com/v1/companies/{slug}/postings
#                    https://api.smartrecruiters.com/v1/companies/{slug}/postings/{id}  (full body)
#   workable:        POST https://apply.workable.com/api/v3/accounts/{slug}/jobs (list, no body)
#                    https://apply.workable.com/{slug}/jobs/view/{shortcode}.md  (full markdown body)

