# Companies to monitor for off-board postings - roles that often never reach Indeed.
# Crawled by /scan-companies (omnibus) or /scan-companies --only <name> (single), and
# cached daily by .github/workflows/fetch-ats-cache.yml.
# See CLAUDE.md and .claude/commands/scan-companies.md.
#
# >>> EXAMPLE WATCHLIST <<<
# The two entries below are FICTIONAL placeholders (they belong to the Sherlock Holmes
# example profile) so the file has a realistic shape to copy. They do not exist and will
# never return jobs. /onboard Phase 4 replaces them with employers in your own field,
# using companies you already know plus a /discover-companies sweep. Afterwards,
# /discover-companies proposes new ATS-verified additions and /prune-watchlist removes
# stale slugs, so the list maintains itself once those are scheduled.
#
# Filter semantics:
#   Title and location filtering use config/job_seeker.yaml :: target_roles (plus the
#   optional discovery.title_keywords) and :: location. No per-company keyword
#   overrides - single source of truth keeps things consistent.
#
# Grouping:
#   Group companies under comment headers that make sense for your search (by sector,
#   stage, priority, whatever helps you prune). The headers are for humans only;
#   /discover-companies inserts new entries under the best-fitting existing header.
#
# Each company has an `ats` field telling /scan-companies which public job board API to
# hit (Tier 1 fetch). Only companies on one of the five supported ATSes belong here:
# Tier 2/3 fallbacks (WebSearch, WebFetch) are unreliable against modern bot blocking.
# Employers without a supported ATS (many public-sector bodies, for example) are picked
# up via /scan-indeed instead.
#
# Entry fields:
#   name          required, display name (also used by --only)
#   careers_url   required, the human-facing careers page
#   ats.type      greenhouse | lever | ashby | smartrecruiters | workable
#   ats.slug      the board identifier in that ATS's public API (see endpoints below)
#   priority      high | medium | low - scan order, not cadence
#   notes         optional free text (slug quirks, board size, caveats)
#
# ATS endpoint reference:
#   greenhouse:      https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
#   lever:           https://api.lever.co/v0/postings/{slug}?mode=json
#   ashby:           https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
#   smartrecruiters: https://api.smartrecruiters.com/v1/companies/{slug}/postings
#                    https://api.smartrecruiters.com/v1/companies/{slug}/postings/{id}  (full body)
#   workable:        POST https://apply.workable.com/api/v3/accounts/{slug}/jobs (list, no body)
#                    https://apply.workable.com/{slug}/jobs/view/{shortcode}.md  (full markdown body)

companies:

  # --- Example group: fictional placeholders, replaced by /onboard ---

  - name: Baskerville & Co
    careers_url: https://careers.example.com/baskerville
    ats:
      type: greenhouse
      slug: baskerville-example
    priority: high
    notes: |
      FICTIONAL example entry. Shows a typical high-priority employer with a
      Greenhouse board. Replace with a real company.

  - name: Reichenbach Analytics
    careers_url: https://careers.example.com/reichenbach
    ats:
      type: ashby
      slug: reichenbach-example
    priority: medium
    notes: |
      FICTIONAL example entry. Notes are for anything worth flagging: a slug
      that differs from the company name, a very large board, a niche caveat.

# Updated by /scan-indeed and /scan-companies after each run. Dedup is sourced from
# the postings/ directory, not from a URL list - see .claude/commands/scan-indeed.md Step 1.
state:
  last_run: null
